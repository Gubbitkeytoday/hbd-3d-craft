name: Feature request / ขอฟีเจอร์
description: Propose a new cake, backdrop, sound, beat or creator option for HBD 3D Craft
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ขอบคุณสำหรับไอเดีย โปรดเล่าว่าผู้ส่งหรือผู้รับจะได้อะไร
        Thanks for the idea. Please describe who benefits: the sender, the recipient, or both.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation / ปัญหาหรือแรงจูงใจ
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / สิ่งที่เสนอ
      description: How it should look or work. Note anything that must travel in the share link.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints to keep in mind / ข้อจำกัด
      description: Old links must keep working, phones have a 150 draw-call budget, third-party assets must be CC0.
    validations:
      required: false
