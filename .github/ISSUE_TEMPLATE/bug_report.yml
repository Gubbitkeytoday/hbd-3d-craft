name: 🐛 Bug Report
description: Report a WebGL rendering glitch, audio issue, or UI defect in HBD 3D Craft
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to improve HBD 3D Craft!
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: What browser, device, and operating system were you using?
      placeholder: Chrome 127 on Windows / Safari on iOS 17.5
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the issue.
      placeholder: |
        1. Open '#card=...'
        2. Tap envelope
        3. Observe WebGL cake canvas error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead.
    validations:
      required: true
